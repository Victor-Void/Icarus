services:
  icarus:
    build: .
    container_name: icarus
    restart: unless-stopped
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL:?set WEBHOOK_URL in .env or shell}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./state.db:/app/state.db
    command: ["python", "main.py", "--loop", "30"]
