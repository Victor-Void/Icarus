services:
  icarus:
    build: .
    container_name: icarus
    restart: unless-stopped
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL:?set WEBHOOK_URL in .env or shell}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    command: ["python", "main.py", "--loop", "30", "--db", "/app/data/state.db"]
